name: drivebee_mobile
description: "DriveBee - Sri Lanka Vehicle Rental Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^16.0.0

  # Networking
  dio: ^5.9.0
  http: ^1.2.0

  # Secure Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.2.0

  # UI
  google_fonts: ^6.3.1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.0
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Logging
  logger: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Development Tools
  rename_app: ^1.6.6
  change_app_package_name: ^1.5.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/
    - assets/animations/

  # fonts:
