name: drivebee_mobile
description: "DriveBee - Sri Lanka Vehicle Rental Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^16.0.0

  # Networking
  dio: ^5.9.0
  http: ^1.2.0

  # Secure Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.2.0

  # UI
  google_fonts: ^6.3.1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.0
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Logging
  logger: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Development Tools
  rename_app: ^1.6.6
  change_app_package_name: ^1.5.0

  # App Icon & Splash Screen generators
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

# ─────────────────────────────────────────────────────────────────────────────
# App Icon Configuration (flutter_launcher_icons)
# 1. Place your 1024x1024 PNG icon at:  assets/icon/icon.png
# 2. Run:  dart run flutter_launcher_icons
# ─────────────────────────────────────────────────────────────────────────────
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#FFFFFF"
    theme_color: "#FFCD00"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256

# ─────────────────────────────────────────────────────────────────────────────
# Splash Screen Configuration (flutter_native_splash)
# 1. Place a 500x500 PNG brand image at: assets/splash/splash_logo.png
# 2. Run:  dart run flutter_native_splash:create
# 3. To remove:  dart run flutter_native_splash:remove
# ─────────────────────────────────────────────────────────────────────────────
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#121212"
  image: assets/splash/splash_logo.png
  image_dark: assets/splash/splash_logo.png
  branding: assets/splash/splash_logo.png
  android_12:
    image: assets/splash/splash_logo.png
    icon_background_color: "#FFFFFF"
  fullscreen: false

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/
    - assets/animations/

